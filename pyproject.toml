[project]
name = "projet-timelaps"
version = "0.1.0"
description = "Local web page that plays the SpotRiviere photos as an aligned, crossfaded timelapse"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1",
    "pillow>=12",
]

[project.optional-dependencies]
# Optional point suggestion on the alignment page (PLAN.md step 2, "later").
suggest = [
    "numpy",
    "opencv-python-headless",
]
# Development tools: .venv/bin/pip install -e ".[dev]"
dev = [
    "pre-commit>=4",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat layout: plain modules at the root, no package directory.
py-modules = ["catalog", "align", "app"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["SpotRiviere", "cache"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
