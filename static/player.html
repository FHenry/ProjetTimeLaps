<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpotRiviere timelapse</title>
<style>
  :root {
    --panel: rgba(18, 20, 23, 0.82); --line: rgba(255, 255, 255, 0.14);
    --text: #ececec; --muted: #a3a8ae; --accent: #ffc94d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text);
    font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    opacity: 0; user-select: none; -webkit-user-drag: none; }
  #date { position: fixed; left: 20px; top: 16px; font-size: clamp(16px, 2.4vw, 30px); font-weight: 600;
    text-shadow: 0 1px 4px #000, 0 0 12px #000a; pointer-events: none; font-variant-numeric: tabular-nums; }
  #date small { display: block; font-size: 0.5em; font-weight: 400; color: #ddd; }
  #date.hidden { display: none; }
  #controls { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    width: min(1100px, calc(100vw - 32px)); background: var(--panel); backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; transition: opacity .4s; }
  /* Timeline: a range input over a strip of ticks (one per photo) and year labels.
     --thumb is the range thumb width; ticks are inset by half of it so they line up. */
  #timeline { --thumb: 16px; position: relative; flex: 1 1 100%; height: 44px; }
  #ticks { position: absolute; left: calc(var(--thumb) / 2); right: calc(var(--thumb) / 2); top: 6px; height: 12px; }
  #ticks i { position: absolute; top: 0; width: 1px; height: 12px; background: rgba(255,255,255,.45); }
  #years { position: absolute; left: calc(var(--thumb) / 2); right: calc(var(--thumb) / 2); top: 26px; height: 16px;
    font-size: 11px; color: var(--muted); }
  #years span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  #years span::before { content: ""; position: absolute; left: 50%; top: -9px; width: 1px; height: 6px; background: var(--muted); }
  #scrub { position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 24px; margin: 0;
    background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
  #scrub::-webkit-slider-runnable-track { height: 24px; background: transparent; }
  #scrub::-moz-range-track { height: 24px; background: transparent; }
  #scrub::-webkit-slider-thumb { -webkit-appearance: none; width: var(--thumb); height: 24px; border-radius: 4px;
    background: var(--accent); box-shadow: 0 0 0 2px #000a; }
  #scrub::-moz-range-thumb { width: var(--thumb); height: 24px; border: 0; border-radius: 4px;
    background: var(--accent); box-shadow: 0 0 0 2px #000a; }
  #scrub:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
  #bubble { position: absolute; bottom: 34px; transform: translateX(-50%); background: #000d; color: #fff;
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 13px; white-space: nowrap;
    pointer-events: none; display: none; font-variant-numeric: tabular-nums; }
  #bubble.show { display: block; }
  select { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 8px; font: inherit; }
  select option { background: #222; }
  body.idle #controls, body.idle #topLinks, body.idle #uploads { opacity: 0; pointer-events: none; }
  body.idle { cursor: none; }
  button { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button:hover { background: rgba(255,255,255,.16); }
  #play { min-width: 84px; font-weight: 600; }
  label { display: flex; align-items: center; gap: 8px; color: var(--muted); white-space: nowrap; }
  label output { color: var(--text); min-width: 3.4em; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 130px; accent-color: var(--accent); }
  #counter { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
  #topLinks { position: fixed; right: 16px; top: 14px; display: flex; gap: 8px; transition: opacity .4s; }
  #topLinks a { color: var(--text); text-decoration: none; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 10px; }
  [hidden] { display: none !important; }
  #empty { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; }
  #help { position: fixed; right: 16px; top: 54px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; display: none; }
  #help.show { display: block; }
  #help div { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; }
  kbd { background: rgba(255,255,255,.1); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font: 12px monospace; }
  #drop { position: fixed; inset: 12px; border: 3px dashed var(--accent); border-radius: 16px; background: #000b;
    display: grid; place-items: center; font-size: 22px; z-index: 20; pointer-events: none; }
  #uploads { position: fixed; right: 16px; top: 54px; width: min(420px, calc(100vw - 32px)); max-height: 60vh;
    overflow-y: auto; background: var(--panel); backdrop-filter: blur(8px); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; z-index: 10; }
  #uploads header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  #uploads header button { padding: 2px 8px; }
  #uploadList { list-style: none; margin: 0; padding: 0; }
  #uploadList li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 4px 0;
    border-top: 1px solid var(--line); font-size: 13px; }
  #uploadList .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #uploadList .st { color: var(--muted); }
  #uploadList .ok { color: #3ccf7a; } #uploadList .err { color: #ff7a7a; }
  #uploadList .msg { grid-column: 1 / 3; color: var(--muted); font-size: 12px; }
  #uploads .actions { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  #uploads .actions a { background: var(--accent); color: #000; font-weight: 600; text-decoration: none;
    border-radius: 8px; padding: 6px 12px; }
  #uploads .hint { color: var(--muted); font-size: 12px; }
  @media (max-width: 600px) { input[type=range] { width: 90px; } #counter { margin-left: 0; } }
</style>
</head>
<body>
<div id="stage"><img id="layerA" alt=""><img id="layerB" alt=""></div>
<div id="date"></div>
<div id="topLinks">
  <a href="#" id="uploadBtn" title="Or drop photos anywhere on the page">Upload</a>
  <a href="#" id="helpBtn">Keys</a>
  <a href="/align">Alignment</a>
</div>
<div id="help"><div>
  <kbd>Space</kbd><span>play / pause</span>
  <kbd>F</kbd><span>full screen</span>
  <kbd>D</kbd><span>show / hide the date</span>
  <kbd>L</kbd><span>loop on / off</span>
  <kbd>← →</kbd><span>previous / next photo</span>
  <kbd>Home End</kbd><span>first / last photo</span>
  <span>Drop files</span><span>add photos</span>
</div></div>
<div id="controls">
  <div id="timeline">
    <div id="ticks"></div>
    <div id="years"></div>
    <input type="range" id="scrub" min="0" max="1" step="1" value="0" aria-label="Date">
    <div id="bubble"></div>
  </div>
  <button id="play">▶ Play</button>
  <label>Fade <input type="range" id="fade" min="0" max="5" step="0.1"><output id="fadeOut"></output></label>
  <label>Hold <input type="range" id="hold" min="0" max="10" step="0.1"><output id="holdOut"></output></label>
  <label><input type="checkbox" id="loop"> Loop</label>
  <label>Spacing <select id="spacing" title="How photos are spread along the date slider">
    <option value="even">even</option><option value="time">real time</option></select></label>
  <button id="fullscreen" title="F">⛶ Full screen</button>
  <span id="counter"></span>
</div>
<input type="file" id="filePick" multiple accept=".jpg,.jpeg,.png,.webp,.tif,.tiff,image/jpeg,image/png,image/webp,image/tiff" hidden>
<div id="drop" hidden>Drop photos to add them to the timelapse</div>
<section id="uploads" hidden>
  <header><strong>Upload</strong><button id="uploadClose" title="Close">✕</button></header>
  <ul id="uploadList"></ul>
  <div class="actions" id="uploadActions"></div>
</section>
<div id="empty" hidden>No aligned frames yet.<br>Align the photos and generate the frames on <a href="/align" style="color:var(--accent)">/align</a>.</div>

<script>
const $ = (id) => document.getElementById(id);
const layers = [$("layerA"), $("layerB")];
let frames = [], cur = -1, front = 0, playing = false, timer = null, showToken = 0;

// ---------- settings (remembered in localStorage) ----------
const DEFAULTS = { fade: 0.8, hold: 0.7, loop: true, showDate: true, spacing: "even" };
let settings = { ...DEFAULTS };
try { Object.assign(settings, JSON.parse(localStorage.getItem("player.settings") || "{}")); } catch {}
function saveSettings() { try { localStorage.setItem("player.settings", JSON.stringify(settings)); } catch {} }

function bindSettings() {
  for (const k of ["fade", "hold"]) {
    const input = $(k), out = $(k + "Out");
    input.value = settings[k];
    out.textContent = `${(+settings[k]).toFixed(1)} s`;
    input.oninput = () => { settings[k] = +input.value; out.textContent = `${settings[k].toFixed(1)} s`; saveSettings(); };
  }
  $("loop").checked = settings.loop;
  $("loop").onchange = () => { settings.loop = $("loop").checked; saveSettings(); };
  $("spacing").value = settings.spacing === "time" ? "time" : "even";
  $("spacing").onchange = () => { settings.spacing = $("spacing").value; saveSettings(); buildTimeline(); };
  $("date").classList.toggle("hidden", !settings.showDate);
}

// ---------- preloading ----------
const sleep = (ms) => new Promise((res) => setTimeout(res, ms));
// Resolve once the image is loaded, then give decode() a short chance to finish
// off the main thread. Never hangs: decode() is only an optimisation.
function ready(im) {
  const loaded = im.complete && im.naturalWidth ? Promise.resolve()
    : new Promise((res) => { im.addEventListener("load", res, { once: true }); im.addEventListener("error", res, { once: true }); });
  return loaded.then(() => Promise.race([im.decode().catch(() => {}), sleep(1000)]));
}

const decoded = new Map();  // src -> Promise<void>
function preload(i) {
  const f = frames[i];
  if (!f || decoded.has(f.src)) return decoded.get(f?.src);
  const im = new Image();
  im.src = f.src;
  const p = ready(im);
  decoded.set(f.src, p);
  if (decoded.size > 16) decoded.delete(decoded.keys().next().value);
  return p;
}
function preloadAhead(i, n = 4) {
  for (let k = 1; k <= n; k++) {
    const j = settings.loop ? (i + k) % frames.length : i + k;
    if (j < frames.length) preload(j);
  }
}

// ---------- showing a frame with a crossfade ----------
// The incoming layer goes on top and fades 0 -> 1 over the outgoing one, which
// stays fully opaque underneath, so there is no brightness dip mid-fade.
let target = -1;  // most recently requested frame (cur only changes once it is on screen)
async function show(i, fadeMs) {
  const token = ++showToken;
  target = i;
  const f = frames[i];
  await preload(i);
  if (token !== showToken) return false;  // a newer show() call won
  const inc = layers[1 - front], out = layers[front];
  inc.style.transition = "none";
  inc.style.opacity = "0";
  inc.src = f.src;
  await ready(inc);
  if (token !== showToken) return false;
  out.style.zIndex = "1";
  inc.style.zIndex = "2";
  void inc.offsetWidth;  // apply opacity 0 before starting the transition
  inc.style.transition = fadeMs > 0 ? `opacity ${fadeMs}ms linear` : "none";
  inc.style.opacity = "1";
  front = 1 - front;
  cur = i;
  updateInfo();
  preloadAhead(i);
  return true;
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
}

function updateInfo() {
  const f = frames[cur];
  $("date").innerHTML = `${fmtDate(f.date)}<small>${f.date.slice(11, 16)}</small>`;
  $("counter").textContent = `${cur + 1} / ${frames.length}`;
  document.title = `${f.date.slice(0, 10)} · SpotRiviere timelapse`;
  if (!scrubbing) $("scrub").value = sliderValue(cur);
}

// ---------- date slider ----------
// "even": one slider step per photo. "time": the slider runs over real time,
// so long gaps between visits show as empty stretches; it snaps to the nearest photo.
const timeMode = () => settings.spacing === "time";
const t0 = () => frames[0].timestamp, t1 = () => frames[frames.length - 1].timestamp;
const sliderValue = (i) => (timeMode() ? frames[i].timestamp : i);
function fraction(i) {  // 0..1 position of photo i along the slider
  if (frames.length < 2) return 0;
  return timeMode() ? (frames[i].timestamp - t0()) / (t1() - t0()) : i / (frames.length - 1);
}
function indexAt(value) {
  if (!timeMode()) return Math.round(value);
  let lo = 0, hi = frames.length - 1;  // binary search for the nearest timestamp
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (frames[mid].timestamp <= value) lo = mid; else hi = mid; }
  return value - frames[lo].timestamp <= frames[hi].timestamp - value ? lo : hi;
}

function buildTimeline() {
  const scrub = $("scrub");
  if (timeMode()) { scrub.min = t0(); scrub.max = t1(); scrub.step = "any"; }
  else { scrub.min = 0; scrub.max = frames.length - 1; scrub.step = 1; }
  $("ticks").innerHTML = frames.map((_, i) => `<i style="left:${(fraction(i) * 100).toFixed(3)}%"></i>`).join("");
  // Year labels: at Jan 1 in time mode, at the year's first photo in even mode.
  const years = [];
  frames.forEach((f, i) => {
    const y = +f.date.slice(0, 4);
    if (i === 0 || y !== +frames[i - 1].date.slice(0, 4)) {
      const x = timeMode() ? Math.max(0, (new Date(y, 0, 1) / 1000 - t0()) / (t1() - t0())) : fraction(i);
      years.push(`<span style="left:${(x * 100).toFixed(3)}%">${y}</span>`);
    }
  });
  $("years").innerHTML = years.join("");
  if (cur >= 0) scrub.value = sliderValue(cur);
}

let scrubbing = false, wasPlaying = false;
function showBubble(i) {
  const b = $("bubble"), w = $("timeline").clientWidth, thumb = 16;
  b.textContent = `${fmtDate(frames[i].date)} · ${i + 1}/${frames.length}`;
  b.style.left = `${thumb / 2 + fraction(i) * (w - thumb)}px`;
  b.classList.add("show");
}
function startScrub() {
  if (scrubbing) return;
  scrubbing = true;
  wasPlaying = playing;
  if (playing) setPlaying(false);
}
function endScrub() {
  if (!scrubbing) return;
  scrubbing = false;
  $("bubble").classList.remove("show");
  $("scrub").value = sliderValue(cur);  // snap the thumb onto the photo
  if (wasPlaying) { playing = true; $("play").textContent = "❚❚ Pause"; scheduleNext(); idleCheck(); }
}
$("scrub").addEventListener("pointerdown", startScrub);
$("scrub").addEventListener("input", () => {
  const i = indexAt(+$("scrub").value);
  if (scrubbing) showBubble(i);
  if (i !== target) show(i, 0);
});
addEventListener("pointerup", endScrub);
addEventListener("pointercancel", endScrub);

// Step to a photo from the keyboard, with a short fade. Steps count from the
// last requested photo, so fast repeated key presses all add up.
function jump(i) {
  if (!frames.length) return;
  i = Math.max(0, Math.min(frames.length - 1, i));
  if (i === target) return;
  show(i, Math.min(settings.fade, 0.25) * 1000).then((ok) => ok && scheduleNext());
}

// ---------- playback ----------
function scheduleNext() {
  clearTimeout(timer);
  if (!playing) return;
  timer = setTimeout(step, (settings.fade + settings.hold) * 1000);
}

async function step() {
  if (!playing) return;
  let next = cur + 1;
  if (next >= frames.length) {
    if (!settings.loop) { setPlaying(false); return; }
    next = 0;
  }
  const shown = await show(next, settings.fade * 1000);
  if (shown) scheduleNext();
}

function setPlaying(on) {
  playing = on && frames.length > 1;
  $("play").textContent = playing ? "❚❚ Pause" : "▶ Play";
  clearTimeout(timer);
  if (playing) {
    if (!settings.loop && cur >= frames.length - 1) show(0, 0).then(scheduleNext);
    else step();
  }
  idleCheck();
}

// ---------- UI ----------
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
}

$("play").onclick = () => setPlaying(!playing);
$("fullscreen").onclick = toggleFullscreen;
$("helpBtn").onclick = (ev) => { ev.preventDefault(); $("help").classList.toggle("show"); };
$("stage").onclick = () => setPlaying(!playing);

addEventListener("keydown", (ev) => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  // Arrow keys adjust the fade/hold sliders when they have focus; everywhere else they step photos.
  if (ev.target instanceof HTMLInputElement && ev.target.type === "range" && ev.target.id !== "scrub"
      && ev.key.startsWith("Arrow")) return;
  if (ev.target instanceof HTMLSelectElement) return;
  const k = ev.key.toLowerCase();
  if (k === "arrowright" || k === "arrowup") { ev.preventDefault(); jump(target + 1); }
  else if (k === "arrowleft" || k === "arrowdown") { ev.preventDefault(); jump(target - 1); }
  else if (k === "home") { ev.preventDefault(); jump(0); }
  else if (k === "end") { ev.preventDefault(); jump(frames.length - 1); }
  else if (k === " ") { ev.preventDefault(); setPlaying(!playing); }
  else if (k === "f") toggleFullscreen();
  else if (k === "d") { settings.showDate = !settings.showDate; saveSettings(); $("date").classList.toggle("hidden", !settings.showDate); }
  else if (k === "l") { settings.loop = !settings.loop; $("loop").checked = settings.loop; saveSettings(); }
  else return;
  wake();
});

// ---------- upload ----------
// One request per file, in order, so each file gets its own status line.
// New photos are then aligned on /align?ids=...; that page renders their frames.
const added = [];
let uploading = false;
const uploadQueue = [];

function uploadRow(file) {
  const li = document.createElement("li");
  li.innerHTML = `<span class="name"></span><span class="st">waiting…</span>`;
  li.querySelector(".name").textContent = file.name;
  $("uploadList").appendChild(li);
  return li;
}
function setRow(li, cls, text, msg) {
  const st = li.querySelector(".st");
  st.className = `st ${cls}`; st.textContent = text;
  if (msg) { const m = document.createElement("span"); m.className = "msg"; m.textContent = msg; li.appendChild(m); }
}

function uploadFiles(files) {
  if (!files.length) return;
  $("uploads").hidden = false;
  $("help").classList.remove("show");
  for (const file of files) uploadQueue.push({ file, li: uploadRow(file) });
  if (!uploading) drainUploads();
}

async function drainUploads() {
  uploading = true;
  updateUploadActions();
  while (uploadQueue.length) {
    const { file, li } = uploadQueue.shift();
    setRow(li, "", "uploading…");
    const body = new FormData();
    body.append("file", file);
    body.append("lastModified", file.lastModified);
    try {
      const r = await fetch("/api/upload", { method: "POST", body });
      const j = await r.json().catch(() => ({ message: `HTTP ${r.status}` }));
      if (r.ok) { added.push(j.entry.id); setRow(li, "ok", `added · ${fmtDate(j.entry.date)}`); }
      else if (j.error === "duplicate") setRow(li, "err", "already there", j.message);
      else setRow(li, "err", "refused", j.message);
    } catch (e) { setRow(li, "err", "failed", String(e)); }
  }
  uploading = false;
  updateUploadActions();
}

function updateUploadActions() {
  const box = $("uploadActions");
  if (uploading) { box.innerHTML = `<span class="hint">Uploading…</span>`; return; }
  if (!added.length) { box.innerHTML = ""; return; }
  const n = added.length;
  box.innerHTML = `<a href="/align?ids=${added.map(encodeURIComponent).join(",")}">Align ${n} new photo${n > 1 ? "s" : ""} →</a>` +
    `<span class="hint">2 clicks each, then the frames are generated.</span>`;
}

$("uploadBtn").onclick = (ev) => { ev.preventDefault(); $("filePick").click(); };
$("filePick").onchange = () => { uploadFiles([...$("filePick").files]); $("filePick").value = ""; };
$("uploadClose").onclick = () => { $("uploads").hidden = true; };

// Drag and drop anywhere on the page. dragenter/dragleave fire for every child
// element, so count them to know when the drag really left the window.
let dragDepth = 0;
const isFileDrag = (ev) => [...(ev.dataTransfer?.types || [])].includes("Files");
addEventListener("dragenter", (ev) => { if (!isFileDrag(ev)) return; ev.preventDefault(); dragDepth++; $("drop").hidden = false; });
addEventListener("dragover", (ev) => { if (!isFileDrag(ev)) return; ev.preventDefault(); ev.dataTransfer.dropEffect = "copy"; });
addEventListener("dragleave", (ev) => { if (!isFileDrag(ev)) return; if (--dragDepth <= 0) { dragDepth = 0; $("drop").hidden = true; } });
addEventListener("drop", (ev) => {
  if (!isFileDrag(ev)) return;
  ev.preventDefault();  // don't let the browser open the file
  dragDepth = 0; $("drop").hidden = true;
  uploadFiles([...ev.dataTransfer.files]);
});

// Hide the controls and cursor while playing and the mouse is still.
let idleTimer = null;
function idleCheck() {
  clearTimeout(idleTimer);
  document.body.classList.remove("idle");
  if (playing && !$("controls").matches(":hover")) idleTimer = setTimeout(() => document.body.classList.add("idle"), 2500);
}
function wake() { idleCheck(); }
addEventListener("mousemove", wake);
addEventListener("touchstart", wake, { passive: true });

(async () => {
  bindSettings();
  frames = await (await fetch("/api/frames")).json();
  if (!frames.length) { $("empty").hidden = false; $("controls").hidden = true; return; }
  buildTimeline();
  const params = new URLSearchParams(location.search);
  const at = frames.findIndex((f) => f.id === params.get("at"));  // ?at=<id>: open on that photo
  await show(Math.max(0, at), 0);
  if (params.has("autoplay")) setPlaying(true);
})();
</script>
</body>
</html>
