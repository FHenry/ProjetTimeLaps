# Install once: .venv/bin/pip install -e ".[dev]" && .venv/bin/pre-commit install
# Run on everything: .venv/bin/pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: no-photos-or-generated-files
        name: originals and generated files stay out of git
        language: fail
        entry: "These paths must not be committed (originals or generated files):"
        files: ^(SpotRiviere|cache|\.venv)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
